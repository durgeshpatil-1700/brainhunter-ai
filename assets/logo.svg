<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" role="img" aria-label="Brainhunter — Building teams and dreams">
  <title>Brainhunter</title>
  <!-- BRAINHUNTER wordmark -->
  <g fill="#1A2B48" font-family="Montserrat, Arial Black, Arial, sans-serif" font-weight="800" font-size="58" letter-spacing="3.5">
    <text x="8" y="62">BR</text>
    <text x="158" y="62">INHUNTER</text>
  </g>
